*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);padding-inline:16px;padding-block:24px 56px}
.wrap{max-width:1500px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:end;justify-content:space-between;margin-bottom:20px}
h1{font:600 clamp(24px,3.4vw,36px)/1.1 var(--serif);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:500 13px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button{display:inline-flex;align-items:center;gap:7px;padding:5px 10px}
.chips button::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.chips button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.slot{margin-bottom:22px}
.time{font:500 13px var(--mono);margin:0 0 8px;display:flex;gap:10px;align-items:baseline;color:var(--ink)}
.time small{color:var(--muted);font-weight:400}
/* Tracks are always side by side. Each time slot scrolls sideways when the screen is narrower than the columns; all slots scroll together. */
:root{--colw:200px;--n:6}
.scroll{overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scroll-padding-left:0;padding-bottom:6px}
.sheet{min-width:calc(var(--n)*var(--colw) + (var(--n) - 1)*10px)}
.heads,.grid{display:grid;gap:10px;grid-template-columns:repeat(var(--n),minmax(var(--colw),1fr))}
.heads{margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cell,.heads>div{scroll-snap-align:start}
.scrollhint{display:none;color:var(--muted);font-size:13px;margin:0}
@media (max-width:1279px){.scrollhint{display:block}}
@media (max-width:699px){:root{--colw:min(300px,80vw)}}
.heads div{font:600 12px var(--sans);letter-spacing:.07em;text-transform:uppercase;border-top:3px solid var(--c);padding-top:6px}
.cell{display:flex;flex-direction:column;gap:10px;min-width:0}
.cell[hidden]{display:none!important}
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:6px;padding:11px 12px 12px;min-width:0}
.tracklabel{font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--c);margin:0 0 4px}
.sname{font:600 14px/1.3 var(--serif);margin:0 0 2px;text-wrap:balance}
a.slink{color:inherit;text-decoration:underline;text-decoration-color:var(--c,var(--muted));text-decoration-thickness:2px;text-underline-offset:3px}
a.slink:hover{color:var(--c,var(--ink))}
li a.slink{text-decoration-thickness:1px;text-decoration-color:var(--line)}
li a.slink:hover{text-decoration-color:var(--c)}
a.slink:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}
.full a.slink:hover{color:inherit;text-decoration-color:currentColor}
.full.keynote a.slink,.full.keynote a.slink:hover{color:var(--keyink);text-decoration-color:currentColor}
.full.keynote a.slink:hover{text-decoration-thickness:3px}
.room{font-size:12px;color:var(--muted);margin:0 0 8px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{border-top:1px solid var(--soft);padding-top:8px;min-width:0}
li:first-child{border-top:0;padding-top:0}
.tt{font:400 11.5px var(--mono);color:var(--muted);display:block}
.title{font-weight:500;overflow-wrap:anywhere}
.who{font-size:12.5px;color:var(--muted);display:block;margin-top:1px}
.note{color:var(--muted);font-style:italic;margin:0}
.empty{display:none}
.full{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.full.keynote{background:var(--key);color:var(--keyink);border-color:var(--key)}
.full.keynote .who,.full.keynote .room{color:inherit;opacity:.8}
.full .tag{font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase}
.full .title{font-family:var(--serif);font-size:16px;font-weight:600}
.minor{color:var(--muted);font-size:13px;padding-block:2px}
.hl .cell-hint{display:none}
.tracklabel{display:none}
.empty{display:block;color:var(--muted);padding:6px 2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

const f=s=>{const [h,m]=s.split(':').map(Number);return (h%12||12)+':'+String(m).padStart(2,'0')};
const rng=r=>{const [a,b]=r.split('-');const ap=+a.slice(0,2)>=12?'pm':'am',bp=+b.slice(0,2)>=12?'pm':'am';return f(a)+(ap!==bp?' '+ap:'')+'–'+f(b)+' '+bp};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let day='thu';const hidden=new Set();
const out=document.getElementById('out');
const link=(id,txt)=>`<a class="slink" href="${href(id)}" target="_blank" rel="noopener noreferrer">${esc(txt)}</a>`;
function cell(k,label,list,ids){
  if(!list||!list.length) return `<div class="cell none" data-t="${k}"><div class="empty">No session</div></div>`;
  return `<div class="cell" data-t="${k}" style="--c:var(--${k})">`+list.map((s,i)=>{const id=(ids||[])[i];const nm=NAMES[id]||s.n;return `<section class="card"><p class="tracklabel">${esc(label)}</p><h3 class="sname">${id?link(id,nm):esc(nm)}</h3><p class="room">${esc(s.r)}</p>${s.talks.length?'<ul>'+s.talks.map((t,j)=>{const tid=(TALKIDS[id]||[])[j];return `<li><span class="tt">${rng(t[0])}</span><span class="title">${tid?link(tid,t[1]):esc(t[1])}</span>${t[2]?`<span class="who">${esc(t[2])}</span>`:''}</li>`}).join('')+'</ul>':'<p class="note">Roundtable discussion with Calvin Institute of Christian Worship staff. No separate talks listed.</p>'}</section>`}).join('')+`</div>`;
}
function render(){
  const d=D.find(x=>x.id===day);
  const heads=`<div class="heads">${TR.map(([k,l])=>`<div data-t="${k}" style="--c:var(--${k})">${l}</div>`).join('')}</div>`;
  out.innerHTML=d.rows.map(r=>{
    if(r.minor) return `<div class="slot"><p class="time">${rng(r.t)} <small>${esc(r.minor)}</small></p></div>`;
    if(r.full){const x=r.full;return `<div class="slot"><p class="time">${rng(r.t)}</p><div class="full ${x.kind}"><span class="tag">${esc(x.tag)}</span><span class="title">${x.id?link(x.id,x.title):esc(x.title)}</span><span class="who">${esc(x.who)}</span><span class="room">${esc(x.room)}</span></div></div>`}
    return `<div class="slot"><p class="time">${rng(r.t)} <small>Parallel sessions</small></p><div class="scroll"><div class="sheet">${heads}<div class="grid">${TR.map(([k,l])=>cell(k,l,r.cols[k],(r.ids||{})[k])).join('')}</div></div></div></div>`;
  }).join('');
  applyHidden();
}
function applyHidden(){
  out.querySelectorAll('[data-t]').forEach(e=>{e.hidden=hidden.has(e.dataset.t)});
  document.documentElement.style.setProperty('--n',Math.max(1,6-hidden.size));
}
let syncing=false;
out.addEventListener('scroll',e=>{const s=e.target;if(syncing||!s.classList||!s.classList.contains('scroll'))return;syncing=true;const x=s.scrollLeft;out.querySelectorAll('.scroll').forEach(o=>{if(o!==s)o.scrollLeft=x});requestAnimationFrame(()=>{syncing=false})},true);
function buildControls(){
  const dEl=document.getElementById('days');
  dEl.innerHTML=D.map(x=>`<button type="button" data-d="${x.id}" aria-pressed="${x.id===day}">${x.label}, ${x.date}</button>`).join('');
  dEl.onclick=e=>{const b=e.target.closest('button');if(!b)return;day=b.dataset.d;dEl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
  const c=document.getElementById('chips');
  c.innerHTML=TR.map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="true" style="--c:var(--${k})">${l}</button>`).join('');
  c.onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;if(hidden.has(k))hidden.delete(k);else hidden.add(k);b.setAttribute('aria-pressed',!hidden.has(k));applyHidden()};
}
buildControls();render();
</script>
